[project]
name = "lol-coach"
version = "0.1.0"
description = "LoL advice generation backed by the user's ChatGPT plan (Sign in with ChatGPT)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/lol_coach"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
